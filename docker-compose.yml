services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lms_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/lms_platform
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pg_data:
